<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMBASA WATER CONNECTION REGISTRATION FORM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url('Water.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
        }  

    
        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color:transparent;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            color: wheat
            ;
        }
        .header p {
            color: wheat;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            background-color: #007BFF;
            color: #fff;
            border-radius: 5px;
            font-size: 12px;
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color:whitesmoke;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .submit-btn {
            background-color: linear-gradient(0deg, rgba(0,40,85,0.8), rgba(0,40,85,1)),
            url('https://images.unsplash.com/photo-1619634457647-85b44b38d3f3?q=80&w=2070') 
            no-repeat center center;
            
            color:black;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
        @media  screen and(max-width:768px) {
            .form-container {
                width: 90%;
                max-width: 90%;
                padding: 20px;
            
        }
        .form-header {
            font-size: 24px;
        }
        .submit-btn {
            padding: 12px 20px;
            font-size: 16px;
        }
        .radio-group, .checkbox-group {
            gap: 10px;
            flex-direction: column;
        }
        body{
            padding: 15px;
        }
    }
            
        </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MOMBASA WATER CONNECTION REGISTRATION</h1>
            <p>Please fill out the form below to register for a new water connection.</p>
            <span class="badge">Mombasa County Only</span>
        </div>
        <form action="/submit_registration" method="POST">
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <div class="radio-buttons">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                    <input type="radio" id="other" name="gender" value="other" required>
                    <label for="other">Other</label>
                </div>
            </div>
            <div class="form-group">
                <label for="idNumber">ID Number:</label>
                <input type="text" id="idNumber" name="idNumber" required>
                </div>
            <div class="form-group">
                <label for="phoneNumber">Phone Number:</label>
                <input type="text" id="phoneNumber" name="phoneNumber" required>
            </div>
        <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="sub-county">Sub-County:</label>
                <select id="sub-county" name="subCounty" required>
                    <option value="">Select Sub-County</option>
                    <option value="likoni">Likoni</option>
                    <option value="mvita">Mvita</option>
                    <option value="nyali">Nyali</option>
                    <option value="kisauni">Kisauni</option>
                    <option value="changamwe">Changamwe</option>
                    <option value="jomvu">Jomvu</option>
                    </select>
                </div>
            <div class="form-group">
                <label for="ward">Ward:</label>
                <select id="ward" name="ward" required>
                    <option value="">Select Ward</option>
                    <optgroup label="Likoni">
                        <option value="shikaadabu">Shika Adabu</option>
                        <option value="mtongwe">Mtongwe</option>
                        <option value="bofu">Bofu</option>
                        <option value="likoni">Likoni</option>
                        <option value="timbwani">Timbwani</option>
                    </optgroup>
                    <optgroup label="Mvita">
                        <option value="makadara">Makadara</option>
                    <option value="tononoka">Tononoka</option>
                    <option value="majengo">Majengo</option>
                    <option value="shimanzi">Shimanzi</option>
                    <option value="tudor">Tudor</option>
                </optgroup>

                <optgroup label="Nyali">
                    <option value="kongowea">Kongowea</option>
                    <option value="kadzandani">Kadzandani</option>
                    <option value="frere-town">Frere Town</option>
                    <option value="ziwa-la-ngombe">Ziwa La Ngombe</option>
                    <option value="mkomani">Mkomani</option>

                </optgroup>
                <optgroup label="Kisauni">
                    <option value="junda">Junda</option>
                    <option value="magogoni">Magogoni</option>
                    <option value="mwakirunge">Mwakirunge</option>
                    <option value="shanzu">Shanzu</option>
                    <option value="kisauni">Kisauni</option>
                    <option value="mtopanga">Mtopanga</option>
                    <option value="bamburi">Bamburi</option>
                </optgroup>
                <optgroup label="Changamwe">
                    <option value="airport">Airport</option>
                    <option value="chaani">Chaani</option>
                    <option value="changamwe">Changamwe</option>
                    <option value="port-reitz">Port Reitz</option>
                    <option value="kipevu">Kipevu</option>
                </optgroup>
                <optgroup label="Jomvu">
                    <option value="jomvu-kuu">Jomvu Kuu</option>
                    <option value="mikindanu">Mikindanu</option>
                    <option value="miritini">Miritini</option>
                </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label for="estate">Estate:</label>
                <input type="text" id="estate" name="estate">
            </div>
            <div class="form-group">
                <label for="plotNumber">Plot Number:</label>
                <input type="text" id="plotNumber" name="plotNumber">
            </div>
            <div class="form-group">
                <label for="connectionType">Connection Type:</label>
                <select id="connectionType" name="connectionType" required>
                    <option value="">Select Connection Type</option>
                    <option value="domestic">Domestic</option>
                    <option value="commercial">Commercial</option>
                    <option value="industrial">Industrial</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>
</body>
</html>
